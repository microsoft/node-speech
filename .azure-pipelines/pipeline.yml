name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main

pr: [main]

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

parameters:
  - name: publishPackage
    displayName: 🚀 Publish @vscode/node-speech
    type: boolean
    default: false

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: node-speech

        buildSteps:
          - pwsh: |
              echo @"
              <?xml version="1.0" encoding="utf-8"?>
              <configuration>
                <packageSources>
                  <clear />
                  <add key="node-speech" value="https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/node-speech/nuget/v3/index.json" />
                </packageSources>
              </configuration>
              "@ > nuget.config
            displayName: Configure NuGet feed

          - task: NuGetAuthenticate@1

          - script: npm ci
            displayName: Install and build

        testPlatforms:
          - name: Linux
            nodeVersions:
              - 22.x
          - name: MacOS
            nodeVersions:
              - 22.x
          - name: Windows
            nodeVersions:
              - 22.x

        testSteps:
          - pwsh: |
              echo @"
              <?xml version="1.0" encoding="utf-8"?>
              <configuration>
                <packageSources>
                  <clear />
                  <add key="node-speech" value="https://pkgs.dev.azure.com/monacotools/Monaco/_packaging/node-speech/nuget/v3/index.json" />
                </packageSources>
              </configuration>
              "@ > nuget.config
            displayName: Configure NuGet feed

          - task: NuGetAuthenticate@1

          - script: npm ci
            displayName: Install and build

          - script: npm run test
            displayName: Test npm package

        # Run on the internal pipeline instead
        skipApiScan: true

        publishPackage: ${{ parameters.publishPackage }}
